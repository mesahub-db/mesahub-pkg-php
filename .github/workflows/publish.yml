name: Publish to Packagist

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      # Packagist auto-syncs via GitHub webhook (configure once in repo settings).
      # This step pings the API as a fallback to ensure the new tag is indexed.
      - name: Notify Packagist
        run: |
          curl -sf -XPOST \
            -H 'content-type: application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/mesahub-db/mesahub-pkg-php"}}'
